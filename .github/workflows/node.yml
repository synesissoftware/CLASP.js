# This workflow will install Node.js, install dependencies, run tests, and
# smoke-test the packed npm tarball.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

#
# Created: 19th August 2026
# Updated: 19th August 2026
#

name: Node

on:
  push:
    branches:
      - master
      - dev
      - boilerplate
      - idiomatic
      - rc1
      - rc2
      - rc3
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:

    strategy:
      fail-fast: false

      matrix:
        node-version:
          - '26'
          - '24'
          - '22'
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checking out code
      uses: actions/checkout@v4

    - name: "Set up Node.js ${{ matrix.node-version }}"
      uses: actions/setup-node@v4
      with:
        node-version: '${{ matrix.node-version }}'
        cache: npm

    - name: "Display Node.js version"
      run: |
        node --version
        npm --version

    - name: "Install dependencies"
      run: npm ci

    - name: "Run all unit-tests"
      run: ./run_all_unit_tests.sh

    - name: "npm pack and install smoke"
      run: |
        tarball=$(npm pack | tail -n 1)
        smoke_dir="$RUNNER_TEMP/clasp-js-smoke"
        mkdir -p "$smoke_dir"
        cd "$smoke_dir"
        npm init --yes >/dev/null
        npm install "$GITHUB_WORKSPACE/$tarball"
        node -e "const clasp = require('clasp-js'); if (!clasp.api || !clasp.specifications || !clasp.usage) { process.exit(1); }"
